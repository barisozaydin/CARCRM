name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify governance and docs
        run: ./scripts/ci/verify.sh

      - name: Lint
        run: ./scripts/ci/lint.sh

      - name: Run test automation
        run: ./scripts/test/run.sh

      - name: Coverage
        run: ./scripts/test/coverage.sh
